name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Engine, gate, fence, compiler and matrix tests
        run: python3 guardrails.py test
      - name: Matrix markdown is up to date
        run: python3 matrix/build_matrix_md.py && git diff --exit-code matrix/MATRIX.md
      - name: Legacy DLP regression suite
        run: python3 claude-code/tests/test_dlp_patterns.py
      - name: OpenClaw config-as-code tests
        run: sh openclaw/test_openclaw_config.sh
      - name: Shell syntax
        run: bash -n skill-scanner/scan_skills.sh && sh -n openclaw/openclaw-config.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
